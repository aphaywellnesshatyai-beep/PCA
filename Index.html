<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>อภัย เวลเนสคลินิกการแพทย์แผนไทย</title>
    <style>
        html, body { margin: 0; height: 100%; background: #f4f2ed; }
        iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
    </style>
</head>
<body>
    <iframe id="app" allow="camera; microphone; fullscreen; clipboard-write" title="ระบบเวชระเบียน"></iframe>
    <script>
        // ใช้ลิงก์ Apps Script ล่าสุดของคุณ
        var BASE = "https://script.google.com/macros/s/AKfycbzp8REJ3VLyaYajrZy9LNRSc7RZkkdMQDBWyRC7hf2UJz1EO979VmtIM470H8NiY5_L_A/exec";
        var frame = document.getElementById('app');

        function withShell(url) { return url + (url.indexOf('?') > -1 ? '&' : '?') + 'shell=1'; }

        var extra = location.search ? '&' + location.search.slice(1) : '';
        frame.src = BASE + '?shell=1' + extra;

        window.addEventListener('message', function (e) {
            var d = e.data || {};
            if (typeof d.string === 'string' && /^https:\/\/script\.google\.com\/(a\/[^\/]+\/)?macros\//.test(d.awGo)) {
                frame.src = withShell(d.awGo);
            }
        });
    </script>
</body>
</html>
