<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
  <?!= include('Theme') ?>
  <style>
    .btn-edit-mode{background:#b7791f!important;color:#fff!important}
    .danger-title{border-left-color:var(--bad)}
  </style>
</head>
<body data-page="Register">
  <div class="page card-lux" style="max-width:960px">
    <h3 class="header-title" id="formHeader">ลงทะเบียนผู้ป่วยใหม่</h3>
    <p class="header-sub" id="formSub">กรอกข้อมูลเวชระเบียนพื้นฐาน ระบบจะออกเลข CN ให้อัตโนมัติเมื่อบันทึก</p>

    <form id="regForm" class="row g-3" onsubmit="return false">
      <div class="section-title">ข้อมูลพื้นฐานระบบ</div>
      <div class="col-6 col-md-4">
        <label class="form-label">เลข CN (อัตโนมัติ)</label>
        <input type="text" id="cn" class="form-control" readonly placeholder="กำลังออกเลข CN...">
        <div id="cnStatus" class="small mt-1" style="display:none;color:var(--bad);font-weight:600;"></div>
      </div>
      <div class="col-6 col-md-4"><label class="form-label">เลข AM</label><input type="text" id="am" class="form-control"></div>
      <div class="col-12 col-md-4"><label class="form-label">เลขบัตรประชาชน</label><input type="text" id="idCard" class="form-control" maxlength="13" placeholder="13 หลัก"></div>

      <div class="section-title">ข้อมูลส่วนบุคคล</div>
      <div class="col-4 col-md-2">
        <label class="form-label">คำนำหน้า</label>
        <select id="pre" class="form-select">
          <option value="">เลือก</option><option>นาย</option><option>นาง</option><option>นางสาว</option><option>เด็กชาย</option><option>เด็กหญิง</option>
        </select>
      </div>
      <div class="col-8 col-md-7"><label class="form-label">ชื่อ-นามสกุล *</label><input type="text" id="name" class="form-control" placeholder="ชื่อจริง นามสกุล"></div>
      <div class="col-12 col-md-3"><label class="form-label">ชื่อเล่น</label><input type="text" id="nickname" class="form-control"></div>

      <div class="col-6 col-md-4"><label class="form-label">วันเดือนปีเกิด (ใช้วิเคราะห์ธาตุเจ้าเรือน)</label><input type="date" id="dob" class="form-control"></div>
      <div class="col-6 col-md-2">
        <label class="form-label">เพศ</label>
        <select id="gender" class="form-select"><option value="ไม่ระบุ">ไม่ระบุ</option><option>ชาย</option><option>หญิง</option></select>
      </div>
      <div class="col-4 col-md-2"><label class="form-label">น้ำหนัก (กก.)</label><input type="text" id="weight" class="form-control"></div>
      <div class="col-4 col-md-2"><label class="form-label">ส่วนสูง (ซม.)</label><input type="text" id="height" class="form-control"></div>
      <div class="col-4 col-md-2"><label class="form-label">อาชีพ</label><input type="text" id="job" class="form-control"></div>

      <div class="section-title">การติดต่อและสิทธิการรักษา</div>
      <div class="col-12 col-md-6"><label class="form-label">เบอร์ติดต่อผู้ป่วย</label><input type="tel" id="tel" class="form-control"></div>
      <div class="col-12 col-md-6">
        <label class="form-label">สิทธิการรักษา</label>
        <select class="form-select" id="medicalPlan">
          <option value="" selected disabled>-- เลือกสิทธิการรักษา --</option>
          <option>ชำระเงินเอง</option><option>ประกันสังคม</option><option>บัตรทอง (30 บาท)</option>
          <option>เบิกจ่ายตรงกรมบัญชีกลาง</option><option value="ประกันชีวิต/ประกันสุขภาพเอกชน">ประกันชีวิต/เอกชน</option>
          <option>เบิกตรงม.อ.</option><option>อื่นๆ</option>
        </select>
      </div>
      <div class="col-12"><label class="form-label">ที่อยู่ปัจจุบัน</label><textarea id="address" class="form-control" rows="2"></textarea></div>

      <div class="section-title danger-title">ข้อมูลกรณีฉุกเฉิน</div>
      <div class="col-12 col-md-7"><label class="form-label">ชื่อ-นามสกุล ญาติ</label><input type="text" id="relName" class="form-control"></div>
      <div class="col-12 col-md-5"><label class="form-label">เบอร์ติดต่อฉุกเฉิน</label><input type="tel" id="relPhone" class="form-control"></div>

      <div class="section-title">ข้อมูลสุขภาพเบื้องต้น</div>
      <div class="col-12">
        <label class="form-label">ประวัติแพ้ยา / โรคประจำตัว / ข้อควรระวัง</label>
        <textarea id="dis" class="form-control" rows="2" style="border-left:5px solid var(--bad);"></textarea>
      </div>

      <div class="col-12 d-flex gap-2 justify-content-end mt-3">
        <button type="button" id="cancelBtn" class="btn btn-outline-secondary px-4" style="display:none" onclick="awGo('Search',{cn:CN_TO_EDIT})">ยกเลิก</button>
        <button type="button" id="regBtn" class="btn btn-lux px-4 py-2" onclick="reg()">บันทึกข้อมูลและออกเลข CN</button>
      </div>
    </form>
  </div>

  <script>
    var PAGE_MODE = "<?= mode ?>";
    var CN_TO_EDIT = "<?= cn ?>";
    var IS_EDIT = (PAGE_MODE === "edit" && CN_TO_EDIT !== "");
    var cnReady = false, cnTimer = null;

    function $(id){ return document.getElementById(id); }
    function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    function showCnError(msg){
      clearTimeout(cnTimer); cnReady = false;
      $('cn').value = ''; $('cn').placeholder = 'ออกเลข CN ไม่สำเร็จ';
      $('cnStatus').innerHTML = esc(msg) + ' <a onclick="loadNextCN()" style="cursor:pointer;color:var(--accent);text-decoration:underline;">ลองใหม่</a>';
      $('cnStatus').style.display = 'block';
    }
    function loadNextCN(){
      $('cn').value = ''; $('cn').placeholder = 'กำลังออกเลข CN...'; $('cnStatus').style.display = 'none'; cnReady = false;
      clearTimeout(cnTimer);
      cnTimer = setTimeout(function(){ if (!cnReady) showCnError('Server ไม่ตอบสนองภายใน 15 วินาที'); }, 15000);
      google.script.run
        .withSuccessHandler(function(n){
          clearTimeout(cnTimer);
          if (!n) return showCnError('Server ไม่ส่งเลข CN กลับมา');
          $('cn').value = n; cnReady = true;
        })
        .withFailureHandler(function(err){ showCnError(err && err.message ? err.message : err); })
        .getNextCN();
    }

    function initPage(){
      if (typeof google === 'undefined' || !google.script || !google.script.run){
        showCnError('ต้องเปิดผ่านลิงก์เว็บแอปที่ Deploy (…/exec)'); return;
      }
      if (!IS_EDIT){ loadNextCN(); return; }

      $('formHeader').innerHTML = "แก้ไขเวชระเบียน <span style='color:var(--gold)'>(CN: " + esc(CN_TO_EDIT) + ")</span>";
      $('formSub').innerText = 'แก้ไขข้อมูลแล้วกดบันทึก ระบบจะอัปเดตข้อมูลในแถวเดิมของผู้ป่วยรายนี้';
      $('regBtn').innerText = 'บันทึกการแก้ไขข้อมูล';
      $('regBtn').classList.add('btn-edit-mode');
      $('cancelBtn').style.display = 'inline-block';
      $('cn').value = CN_TO_EDIT; cnReady = true;

      google.script.run
        .withSuccessHandler(function(p){
          if (!p){ alert("ไม่พบข้อมูลผู้ป่วย CN: " + CN_TO_EDIT); return; }
          $('cn').value = p.cn; $('am').value = p.am || ''; $('pre').value = p.prefix || '';
          $('name').value = p.name || ''; $('nickname').value = p.nickname || '';
          $('dob').value = p.dob ? String(p.dob).split('T')[0] : '';
          $('tel').value = p.phone || ''; $('gender').value = p.gender || 'ไม่ระบุ';
          $('weight').value = p.weight || ''; $('height').value = p.height || ''; $('job').value = p.job || '';
          $('idCard').value = p.idCard || ''; $('address').value = p.address || '';
          $('relName').value = p.relName || ''; $('relPhone').value = p.relPhone || '';
          $('dis').value = p.disease || ''; $('medicalPlan').value = p.medicalPlan || '';
        })
        .withFailureHandler(function(err){ alert("โหลดข้อมูลผู้ป่วยไม่สำเร็จ: " + (err && err.message ? err.message : err)); })
        .searchPatientForEdit(CN_TO_EDIT);
    }

    function reg(){
      var p = {
        cn: $('cn').value, am: $('am').value, prefix: $('pre').value, name: $('name').value.trim(),
        nickname: $('nickname').value, dob: $('dob').value, phone: $('tel').value, gender: $('gender').value,
        weight: $('weight').value, height: $('height').value, job: $('job').value, idCard: $('idCard').value,
        address: $('address').value, relName: $('relName').value, relPhone: $('relPhone').value,
        disease: $('dis').value, medicalPlan: $('medicalPlan').value,
        isNew: !IS_EDIT
      };
      if (!p.name) return alert("กรุณากรอกชื่อ-นามสกุล");
      if (IS_EDIT && !p.cn) return alert("ไม่พบเลข CN ที่ต้องการแก้ไข");

      var btn = $('regBtn'), oldText = btn.innerText;
      btn.disabled = true; btn.innerText = 'กำลังบันทึกข้อมูล...';

      google.script.run
        .withSuccessHandler(function(m){
          alert(m);
          if (String(m).indexOf('✅') === -1){ btn.disabled = false; btn.innerText = oldText; return; }
          var mm = String(m).match(/CN:\s*([0-9A-Za-z]+)/);
          var cn = mm ? mm[1] : p.cn;
          awSetPatient(cn, (p.prefix || '') + p.name);
          awGo('Search', { cn: cn });       // ไปหน้าค้นหา พร้อมแสดงผู้ป่วยรายนี้ทันที
        })
        .withFailureHandler(function(err){
          alert("บันทึกไม่สำเร็จ: " + (err && err.message ? err.message : err));
          btn.disabled = false; btn.innerText = oldText;
        })
        .registerNewPatient(p);
    }

    initPage();
  </script>
</body>
</html>
